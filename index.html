<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>cyph · appendix</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- top HUD: paprika bar, deck chrome (hidden until authed) -->
    <header class="apx-hud" aria-hidden="true">
      <span class="apx-logo">cyph<span class="dot">.appendix</span></span>
      <nav id="apx-tabs" class="apx-tabs" aria-label="drilldowns"></nav>
    </header>
    <div class="apx-progress" aria-hidden="true">
      <div id="apx-progress-fill" class="apx-progress-fill"></div>
    </div>

    <!-- decrypted whitepaper drilldowns are injected here -->
    <main id="deck-root"></main>

    <!-- bottom HUD: prev / title / counter / next -->
    <footer class="apx-foot" aria-hidden="true">
      <button id="apx-prev" aria-label="previous drilldown">←</button>
      <span id="apx-title" class="apx-title"></span>
      <span id="apx-counter" class="apx-counter">00 / 00</span>
      <button id="apx-next" aria-label="next drilldown">→</button>
    </footer>

    <!-- password gate -->
    <div id="auth-gate" aria-label="access gate">
      <div class="auth-panel">
        <div class="station-sign">
          <div class="station-name">internal · appendix</div>
          <div class="station-bullets">
            <span class="station-bullet paprika">C</span
            ><span class="station-bullet cornflower">Y</span
            ><span class="station-bullet amber">P</span
            ><span class="station-bullet amaranth">H</span>
          </div>
        </div>
        <p class="auth-note">
          encrypted internal material. the password decrypts the content in
          your browser — nothing is readable without it.
        </p>
        <form id="auth-form" autocomplete="off">
          <input
            id="auth-input"
            type="password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="password…"
          />
          <button type="submit">enter</button>
        </form>
        <div id="auth-err">&nbsp;</div>
      </div>
    </div>

    <script src="deck.js"></script>
    <script src="gate.js"></script>
  </body>
</html>
