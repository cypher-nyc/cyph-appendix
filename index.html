<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>cyph · appendix</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- running chrome (hidden until authed) -->
    <header class="apx-bar" aria-hidden="true">
      <span class="apx-brand">cyph<span class="dot">.</span>appendix</span>
      <span id="apx-chapter" class="apx-chapter"></span>
      <span id="apx-ctr" class="apx-ctr">00 / 00</span>
    </header>

    <div class="apx-progress" aria-hidden="true">
      <div id="apx-progress-fill" class="apx-progress-fill"></div>
    </div>

    <!-- decrypted slides are injected here -->
    <main id="deck-root"></main>

    <nav class="apx-nav" aria-hidden="true">
      <button id="apx-prev" aria-label="previous">←</button>
      <button id="apx-next" aria-label="next">→</button>
    </nav>

    <!-- password gate -->
    <div id="auth-gate" aria-label="access gate">
      <div class="auth-panel">
        <div class="station-sign">
          <div class="station-name">internal · appendix</div>
          <div class="station-bullets">
            <span class="station-bullet paprika">C</span
            ><span class="station-bullet cornflower">Y</span
            ><span class="station-bullet amber">P</span
            ><span class="station-bullet amaranth">H</span>
          </div>
        </div>
        <p class="auth-note">
          encrypted internal material. the password decrypts the content in
          your browser — nothing is readable without it.
        </p>
        <form id="auth-form" autocomplete="off">
          <input
            id="auth-input"
            type="password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="password…"
          />
          <button type="submit">enter</button>
        </form>
        <div id="auth-err">&nbsp;</div>
      </div>
    </div>

    <script src="deck.js"></script>
    <script src="gate.js"></script>
  </body>
</html>
